<div id="campaign-widget" class="campaign-strip">

    <div id="campaign-collapsed" class="campaign-collapsed">
        <span id="campaign-title-text"></span>
        <div style="display:flex; align-items:center; gap:10px;">
            <button id="campaign-open-btn" type="button">Start</button>
            <button id="campaign-dismiss-collapsed-btn" type="button" class="campaign-close-collapsed">×</button>
        </div>
    </div>

    <div id="campaign-expanded" class="campaign-expanded" style="display:none;">

        <button id="campaign-close-btn" type="button" class="campaign-close">×</button>

        <h4 id="campaign-question-text"></h4>

        <div id="campaign-options"></div>

        <div id="campaign-reward" class="campaign-reward" style="display:none;"></div>

    </div>

</div>
