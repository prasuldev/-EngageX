<div class="campaign-strip">

    <div class="campaign-collapsed">
        <div class="campaign-shine"></div>

        <div class="campaign-icon">✨</div>

        <div class="campaign-text">
            <span class="campaign-title-text"></span>
            <span class="campaign-subtitle-text"></span>
        </div>

        <div class="campaign-actions">
            <button type="button" class="campaign-open-btn">
                Play Now <span class="campaign-btn-arrow">→</span>
            </button>
            <button type="button" class="campaign-close-collapsed">×</button>
        </div>
    </div>

    <div class="campaign-expanded" style="display:none;">

        <button type="button" class="campaign-close-btn campaign-close">×</button>

        <h4 class="campaign-question-text"></h4>

        <!-- Universal campaign content -->
        <div class="campaign-content"></div>

        <!-- Reward -->
        <div class="campaign-reward" style="display:none;"></div>

    </div>

</div>
