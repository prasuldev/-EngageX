<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products | Maquillage</title>

    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/ai.css">
    <link rel="stylesheet" href="../css/products.css">
    <link rel="stylesheet" href="../css/category.css">
    <link rel="stylesheet" href="../css/dark-mode.css">

</head>

<body class="bg-gray-50">

    <!-- Navbar -->
    <div id="navbar"></div>

    <main class="max-w-7xl mx-auto px-6 py-10">

        <div class="flex justify-between items-center mb-8">

            <div>

                <h1 class="text-5xl font-bold text-center">
                    Shop by Category
                </h1>

                <p class="text-gray-500 text-center mt-4 text-lg">
                    Select a category to explore our beauty collection.
                </p>

            </div>

        </div>

        <!-- Loading -->
        <div
            id="loading"
            class="text-center py-10">

            Loading Products...

        </div>

        <div class="category-row" id="categoryRow1"></div>
        <div class="category-row" id="categoryRow2"></div>

    </main>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- AI -->
    <section id="ai-section"></section>

    <script src="../js/session.js"></script>
    <script src="../js/loadComponents.js"></script>

    <script type="module" src="../js/products.js"></script>

</body>

</html>
