<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | Maquillage</title>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-50">

    <!-- Navbar -->
    <div id="navbar"></div>

    <!-- Page Content -->
    <div class="max-w-7xl mx-auto px-6 py-10">

        <div class="mb-10">

            <h1 class="text-4xl font-bold">
                Shopping Cart
            </h1>

            <p class="text-gray-500 mt-2">
                Review your selected beauty products
            </p>

        </div>

        <div class="grid lg:grid-cols-3 gap-8">

            <!-- Cart Section -->
            <div class="lg:col-span-2">

                <div
                    id="cart-items"
                    class="space-y-6">

                </div>

                <!-- Continue Shopping -->
                <div class="mt-8">

                    <a
                        href="../pages/products.html"
                        class="inline-flex items-center gap-2 text-pink-600 font-medium hover:underline">

                        ← Continue Shopping

                    </a>

                </div>

            </div>

            <!-- Order Summary -->
            <div
                class="bg-white rounded-2xl shadow-md p-6 h-fit sticky top-24">

                <h2 class="text-2xl font-semibold mb-6">
                    Order Summary
                </h2>

                <div class="space-y-4">
                    <div class="flex justify-between">
                        <span class="text-gray-600">Subtotal</span>
                        <span id="subtotal" class="font-medium">₹0</span>
                    </div>

                    <div class="flex justify-between">
                        <span class="text-gray-600">COD Charge</span>
                        <span id="codCharge" class="font-medium">₹0</span>
                    </div>

                    <div class="flex justify-between">
                        <span class="text-gray-600">Platform Fee</span>
                        <span id="platformFee" class="font-medium">₹0</span>
                    </div>

                    <div class="flex justify-between">
                        <span class="text-gray-600">Shipping</span>
                        <span class="text-green-600">Free</span>
                    </div>

                    <hr>

                    <div class="flex justify-between text-xl font-bold">
                        <span>Total</span>
                        <span id="total" class="text-pink-600">₹0</span>
                    </div>
                </div>

                <div id="addressSection" class="mb-4">
                    <h3 class="text-sm font-semibold text-gray-700 mb-2">Deliver to</h3>
                    <div id="addressPicker" class="space-y-2"></div>
                    <a href="profile.html" class="text-pink-600 text-sm hover:underline">+ Add new address</a>
                </div>

                <button
                    id="checkoutBtn"
                    class="w-full mt-6 bg-pink-600 text-white py-3 rounded-xl hover:bg-pink-700 transition font-medium">

                    Secure Checkout

                </button>

            </div>

        </div>

    </div>

    <script src="../js/session.js"></script>
    <script src="../js/loadComponents.js"></script>
    <script type="module" src="../js/cart.js"></script>

</body>

</html>
