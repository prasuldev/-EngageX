<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shop</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/dark-mode.css">

</head>
<body>

    <div id="navbar"></div>

    <main>
        <section id="shop-header" class="section-title">
            <h2>Shop All Products</h2>
        </section>

        <section id="filters">
            <button class="filter-btn" data-category="">All</button>
            <button class="filter-btn" data-category="Moisturizer">Moisturizer</button>
            <button class="filter-btn" data-category="Cleanser">Cleanser</button>
            <button class="filter-btn" data-category="Serum">Serum</button>
            <button class="filter-btn" data-category="Sun protect">Sun Protect</button>
        </section>

        <section id="shop-products">
            <div id="products-container" class="products-grid"></div>
        </section>
    </main>

    <div id="footer"></div>

    <script src="../js/session.js"></script>
    <script>
        if (!isLoggedIn()) {
            window.location.href = "login.html";
        }
    </script>

    <script src="../js/navbar.js"></script>
    <script src="../js/shop.js"></script>
    <script src="../js/loadComponents.js"></script>

    <script>
        lucide.createIcons();
    </script>

</body>
</html>
