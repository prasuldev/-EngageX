<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | Maquillage</title>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="../css/orders.css">
</head>

<body class="bg-gray-50">

    <div id="navbar"></div>

    <div class="max-w-7xl mx-auto px-6 py-10">

        <!-- List view -->
        <div id="orderListView">

            <div class="mb-10">
                <h1 class="text-4xl font-bold">My Orders</h1>
                <p class="text-gray-500 mt-2">Track, manage and review your past orders</p>
            </div>

            <div id="orderList" class="space-y-5"></div>

        </div>

        <!-- Detail view -->
        <div id="orderDetailView" class="hidden">

            <a href="cart.html" class="inline-flex items-center gap-2 text-pink-600 font-medium hover:underline mb-6">
                <i class="fa-solid fa-arrow-left"></i> Back to Cart
            </a>

            <h1 id="ordersPageSubtitle" class="text-3xl font-bold mb-8"></h1>

            <div class="grid lg:grid-cols-3 gap-8">

                <!-- Left: tracker + items + address -->
                <div class="lg:col-span-2 space-y-6">

                    <div class="bg-white rounded-2xl shadow-sm border p-6">
                        <div id="orderTracker" class="order-tracker"></div>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border p-6">
                        <h3 class="text-lg font-semibold mb-4">Items</h3>
                        <div id="orderItems" class="divide-y"></div>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border p-6">
                        <h3 class="text-lg font-semibold mb-4">Shipping Address</h3>
                        <div id="orderAddress" class="text-gray-600 text-sm space-y-1"></div>
                    </div>

                </div>

                <!-- Right: summary + actions -->
                <div class="bg-white rounded-2xl shadow-md p-6 h-fit sticky top-6 space-y-6">

                    <div>
                        <h3 class="text-lg font-semibold mb-4">Order Summary</h3>
                        <div id="orderMeta" class="space-y-3 text-sm"></div>
                    </div>

                    <div id="orderActions" class="space-y-3"></div>

                </div>

            </div>

        </div>

        <!-- Rate Product Modal -->
        <div id="reviewModal" class="hidden fixed inset-0 bg-black/45 backdrop-blur-sm flex items-center justify-center z-50">
            <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
                <span id="closeReviewModal" class="absolute top-4 right-5 text-2xl text-gray-400 hover:text-pink-600 cursor-pointer">&times;</span>
                <h2 class="text-xl font-bold text-pink-600 text-center mb-1">Rate this product</h2>
                <p id="reviewProductName" class="text-center text-gray-500 text-sm mb-6"></p>

                <div id="starPicker" class="flex justify-center gap-2 mb-6 text-3xl"></div>

                <div id="reasonTags" class="flex flex-wrap gap-2 justify-center mb-6"></div>

                <button id="submitReviewBtn" disabled
                class="w-full py-3 bg-pink-600 text-white rounded-xl font-semibold hover:bg-pink-700 transition disabled:opacity-40 disabled:cursor-not-allowed">
                Submit Rating
                </button>
            </div>
        </div>

    </div>

    <script src="../js/session.js"></script>
    <script src="../js/loadComponents.js"></script>
    <script src="../js/orders.js"></script>

</body>

</html>
