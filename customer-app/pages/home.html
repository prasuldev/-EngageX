<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Home</title>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/ai.css">
    <link rel="stylesheet" href="../css/customer-ai.css">
    <link rel="stylesheet" href="../css/dark-mode.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/campaigns/campaign-shell.css">
    <link rel="stylesheet" href="../css/campaigns/beauty-match.css">

</head>

<body>

    <div id="navbar"></div>

    <main>

        <section id="hero"></section>
        <section id="categories"></section>

        <section class="customer-ai" aria-labelledby="customer-ai-title">
            <div class="customer-ai__hero">
                <div>
                    <span class="customer-ai__eyebrow">EngageX AI Beauty Intelligence</span>
                    <h2 id="customer-ai-title">Your beauty edit, made personal</h2>
                    <p>Recommendations, replenishment timing, routines and offers grounded in your EngageX activity.</p>
                </div>
                <span class="customer-ai__spark" aria-hidden="true">✦</span>
            </div>
            <div id="customer-ai-content" class="customer-ai__content" aria-live="polite">
                <div class="customer-ai__loading">Preparing your personalized beauty feed…</div>
            </div>
        </section>

        <section id="featured-products">
            <h2 class="section-title">
                Featured Products
            </h2>
            <div id="products-container" class="products-grid">
            </div>
        </section>

        <section id="ai-section"></section>

    </main>

    <div id="footer"></div>

    <script src="../js/session.js"></script>

    <script>
        if (!isLoggedIn()) {
            window.location.href = "login.html";
        }

        const user = getLoggedInUser();

        console.log(user);

        if (user) {
            document.title = `Welcome ${user.full_name}`;
        }
    </script>


    <!-- Campaign engine: must load before app.js, which calls
         loadActiveCampaigns() / mountCampaignWidget() while rendering products -->
    <script src="../js/campaigns/campaign-core.js"></script>
    <script src="../js/campaigns/renderers/poll-renderer.js"></script>
    <script src="../js/campaigns/renderers/beauty-match-renderer.js"></script>
    <script src="../js/campaigns/renderers/skin-twin-renderer.js"></script>
    <script src="../js/campaigns/renderers/mood-ritual-renderer.js"></script>

    <script src="../js/app.js"></script>
    <script src="../js/loadComponents.js"></script>
    <script src="../js/customer-ai-home.js"></script>

    <script>
        lucide.createIcons();
    </script>

</body>
</html>
