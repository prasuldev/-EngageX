<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Home</title>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/ai.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/campaigns/campaign-shell.css">
    <link rel="stylesheet" href="../css/campaigns/beauty-match.css">

</head>

<body>

    <div id="navbar"></div>

    <main>

        <section id="hero"></section>
        <section id="categories"></section>

        <section id="featured-products">
            <h2 class="section-title">
                Featured Products
            </h2>
            <div id="products-container" class="products-grid">
            </div>
        </section>

        <section id="ai-section"></section>

    </main>

    <div id="footer"></div>

    <script src="../js/session.js"></script>

    <script>
        if (!isLoggedIn()) {
            window.location.href = "login.html";
        }

        const user = getLoggedInUser();

        console.log(user);

        if (user) {
            document.title = `Welcome ${user.full_name}`;
        }
    </script>

    <script src="../js/navbar.js"></script>

    <!-- Campaign engine: must load before app.js, which calls
         loadActiveCampaigns() / mountCampaignWidget() while rendering products -->
    <script src="../js/campaigns/campaign-core.js"></script>
    <script src="../js/campaigns/renderers/poll-renderer.js"></script>
    <script src="../js/campaigns/renderers/beauty-match-renderer.js"></script>
    <script src="../js/campaigns/renderers/skin-twin-renderer.js"></script>
    <script src="../js/campaigns/renderers/mood-ritual-renderer.js"></script>

    <script src="../js/app.js"></script>
    <script src="../js/loadComponents.js"></script>

    <!-- AI Widget -->
    <script>
        fetch("../components/ai-chat.html")
            .then(response => response.text())
            .then(html => {
                document.getElementById("ai-section").innerHTML = html;

                const script = document.createElement("script");
                script.type = "module";
                script.src = "../js/ai.js";
                document.body.appendChild(script);
            });
    </script>

    <script>
        lucide.createIcons();
    </script>

</body>
</html>
