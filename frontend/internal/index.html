<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EngageX Internal — Log in</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="login-page">

  <div class="login-box">
    <div class="login-mark" aria-hidden="true">EX</div>
    <h1 class="login-title">EngageX Internal</h1>
    <p class="subtitle">Marketing &amp; Admin Portal</p>

    <form id="login-form">
      <label class="field">
        <span>Email</span>
        <input type="email" id="email" required autocomplete="username">
      </label>

      <label class="field">
        <span>Password</span>
        <input type="password" id="password" required autocomplete="current-password">
      </label>

      <button type="submit" class="btn-primary login-submit">Log in</button>

      <p id="error-msg" class="form-error"></p>
    </form>
  </div>
  <script src="js/auth.js"></script>

</body>
</html>
