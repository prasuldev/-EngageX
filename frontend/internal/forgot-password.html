<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password — EngageX Internal</title>
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="login-page">
  <div class="login-box">
    <div class="login-mark" aria-hidden="true">EX</div>
    <h1 class="login-title">Reset your password</h1>
    <p class="subtitle">Enter your email and we'll send a reset link.</p>

    <form id="forgot-form">
      <label class="field">
        <span>Email</span>
        <input type="email" id="email" required>
      </label>
      <button type="submit" class="btn-primary login-submit">Send reset link</button>
      <p id="msg" class="form-error"></p>
    </form>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:8000";
    document.getElementById("forgot-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.textContent = "";
      const res = await fetch(`${API_BASE}/auth/forgot-password`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: document.getElementById("email").value })
      });
      const data = await res.json();
      msg.style.color = "green";
      msg.textContent = data.message;
    });
  </script>
</body>
</html>
