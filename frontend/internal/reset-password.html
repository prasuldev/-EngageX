<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password — EngageX Internal</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    .password-field {
      position: relative;
    }
    .password-field input {
      width: 100%;
      padding-right: 40px;
      box-sizing: border-box;
    }
    .toggle-eye {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      padding: 0;
      line-height: 1;
    }
    .field-hint {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
      display: block;
    }
  </style>
</head>
<body class="login-page">
  <div class="login-box">
    <div class="login-mark" aria-hidden="true">EX</div>
    <h1 class="login-title">Set a new password</h1>

    <form id="reset-form">
      <label class="field">
        <span>New password</span>
        <div class="password-field">
          <input type="password" id="new-password" required minlength="6" maxlength="16">
          <button type="button" class="toggle-eye" data-target="new-password" aria-label="Show password">👁</button>
        </div>
        <span class="field-hint">6–16 characters</span>
      </label>

      <label class="field">
        <span>Re-enter new password</span>
        <div class="password-field">
          <input type="password" id="confirm-password" required minlength="6" maxlength="16">
          <button type="button" class="toggle-eye" data-target="confirm-password" aria-label="Show password">👁</button>
        </div>
      </label>

      <button type="submit" class="btn-primary login-submit">Reset password</button>
      <p id="msg" class="form-error"></p>
    </form>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:8000";
    const token = new URLSearchParams(window.location.search).get("token");

    document.querySelectorAll(".toggle-eye").forEach(btn => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.target);
        const showing = input.type === "text";
        input.type = showing ? "password" : "text";
        btn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
      });
    });

    document.getElementById("reset-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.textContent = "";

      const newPassword = document.getElementById("new-password").value;
      const confirmPassword = document.getElementById("confirm-password").value;

      if (newPassword.length < 6 || newPassword.length > 16) {
        msg.style.color = "red";
        msg.textContent = "Password must be 6–16 characters.";
        return;
      }

      if (newPassword !== confirmPassword) {
        msg.style.color = "red";
        msg.textContent = "Passwords do not match.";
        return;
      }

      const res = await fetch(`${API_BASE}/auth/reset-password`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, new_password: newPassword })
      });
      const data = await res.json();

      if (!res.ok) {
        msg.style.color = "red";
        msg.textContent = data.detail;
        return;
      }
      msg.style.color = "green";
      msg.textContent = "Password reset! Redirecting to login...";
      setTimeout(() => window.location.href = "index.html", 2000);
    });
  </script>
</body>
</html>
